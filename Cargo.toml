[package]
name = "stereo-nudge"
version = "0.2.0"
edition = "2024"
description = "Request Bluetooth stereo audio as soon as a paired headset connects."
license = "MIT"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
